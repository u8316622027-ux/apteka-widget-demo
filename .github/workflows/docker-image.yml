name: Build and Push Docker Image

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

env:
  IMAGE_REPOSITORY: topf3/apteka-mcp

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:latest
            ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}

      - name: Verify production image configuration
        run: |
          docker run --rm ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }} python -c "from app.interfaces.mcp.tools.apteka_urls import get_apteka_base_url, get_apteka_media_base_url, build_front_url; assert get_apteka_base_url() == 'https://api.apteka.md'; assert get_apteka_media_base_url() == 'https://api.apteka.md'; print({'api': get_apteka_base_url(), 'media': get_apteka_media_base_url(), 'order': build_front_url('/order/confirm-order-by-using-mobile')})"
